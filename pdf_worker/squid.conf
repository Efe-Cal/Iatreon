# Internal-only egress proxy for the PDF worker. Do not publish port 3128.
http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Defense in depth: the worker validates URLs before sending them here, and
# Squid independently refuses private, loopback, link-local, and multicast IPs.
acl private_networks dst 0.0.0.0/8
acl private_networks dst 10.0.0.0/8
acl private_networks dst 100.64.0.0/10
acl private_networks dst 127.0.0.0/8
acl private_networks dst 169.254.0.0/16
acl private_networks dst 172.16.0.0/12
acl private_networks dst 192.0.0.0/24
acl private_networks dst 192.0.2.0/24
acl private_networks dst 192.88.99.0/24
acl private_networks dst 192.168.0.0/16
acl private_networks dst 198.18.0.0/15
acl private_networks dst 198.51.100.0/24
acl private_networks dst 203.0.113.0/24
acl private_networks dst 224.0.0.0/4
acl private_networks dst 240.0.0.0/4
acl private_networks dst ::1/128
acl private_networks dst ::/128
acl private_networks dst ::ffff:0:0/96
acl private_networks dst 64:ff9b:1::/48
acl private_networks dst 100::/64
acl private_networks dst fc00::/7
acl private_networks dst fe80::/10
acl private_networks dst 2001::/32
acl private_networks dst 2001:10::/28
acl private_networks dst 2001:db8::/32
acl private_networks dst ff00::/8

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny private_networks
http_access allow all

# Bound both browser and direct-download responses at the network boundary.
reply_body_max_size 104857600 allow all

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log stdio:/dev/stdout
cache_log /dev/stderr
